  name: Update my readme

  on:
    workflow_dispatch:
    schedule:
      - cron: "0 6 * * *"

  jobs:
    update-badges:
      name: Update Readme with badges
      runs-on: ubuntu-latest
      permissions:
        contents: write
      steps:
        - uses: actions/checkout@v4

        - name: Badges - Readme
          uses: pemtajo/badge-readme@main

        - name: Resize Credly badges
          env:
            BADGE_HEIGHT: "50"        # <-- change this to taste (px)
          run: |
            # Pull the commit the badge action just pushed
            git fetch origin
            git reset --hard origin/main

            # Convert each Credly badge from markdown to a fixed-height <img>
            perl -0777 -pi -e '
              my $h = $ENV{BADGE_HEIGHT};
              s{\[!\[([^\]]*)\]\((https://images\.credly\.com[^)]*)\)\]\(([^)]*)\)}
               {<a href="$3"><img src="$2" alt="$1" height="$h" /></a>}gx;
            ' README.md

            # Commit only if something changed
            if ! git diff --quiet; then
              git config user.name  "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -am "Resize certification badges to ${BADGE_HEIGHT}px"
              git push
            fi
